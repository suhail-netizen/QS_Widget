<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Quran TV Channel - Athan Countdown Widget</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    html, body {
      background: transparent; /* Transparent for live-stream overlay use */
      height: 100vh;
      overflow: hidden;
    }

    /* Traced from an actual broadcast frame: the channel's own clock badge
       is a parallelogram at x=1595-1810, y=988-1053 (width 215, height 65),
       with its cut edge running from 72% of the width (top) to the sharp
       point at the bottom-left corner. This is that exact shape rotated
       180 degrees (flip both axes), positioned so its point touches theirs
       at x=1595, forming one continuous shape flanking the clock. */
    .clock-widget {
      position: fixed;
      bottom: 27px;
      right: 325px;
      height: 65px;
      width: 215px;
      background: linear-gradient(180deg, rgba(210,210,210,0.55) 0%, rgba(160,160,160,0.55) 100%);
      clip-path: polygon(0% 0%, 100% 0%, 72% 100%, 0% 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .clock-widget > * {
      transform: translateX(-8px);
    }

    .label-top {
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
      margin-bottom: 3px;
      text-shadow: 0 1px 3px rgba(60, 60, 60, 0.85);
    }

    .row2 {
      display: flex;
      align-items: baseline;
      gap: 6px;
      transform: translateX(-16px);
    }

    .prayer-name {
      font-size: 19px;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(60, 60, 60, 0.85);
    }

    .clock-value {
      font-size: 30px;
      font-weight: 800;
      color: #FFFFFF;
      direction: ltr;
      text-shadow: 0 1px 3px rgba(60, 60, 60, 0.85);
    }
  </style>
</head>
<body>

  <div class="clock-widget" id="widget">
    <span class="label-top" id="labelTop">متبقي من الوقت لأذان</span>
    <span class="row2">
      <span class="prayer-name" id="prayerLabel"></span>
      <span class="clock-value" id="clockValue">--:--</span>
    </span>
  </div>

  <script>
    // Masjid al-Haram, Makkah — data pre-fetched from Aladhan (Umm Al-Qura
    // method) for Hijri 1448-1449, served locally so nothing is loaded
    // from a public API at broadcast time.
    const DATA_FILES = ['makkah_1448.json', 'makkah_1449.json'];

    const PRAYER_KEYS = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
    const PRAYER_NAMES = { Fajr: 'الفجر', Dhuhr: 'الظهر', Asr: 'العصر', Maghrib: 'المغرب', Isha: 'العشاء' };

    const labelTopEl = document.getElementById('labelTop');
    const labelEl = document.getElementById('prayerLabel');
    const valueEl = document.getElementById('clockValue');

    let TIMES = {};          // "YYYY-MM-DD" -> { weekday, Fajr, Dhuhr, Asr, Maghrib, Isha }
    let schedule = [];       // today's 5 prayers + tomorrow's Fajr, as real Date instants
    let scheduleDateKey = null;
    let scene = 1;            // 1 = countdown, 2 = athan clock time — alternates every 10s

    // Saudi Arabia has a fixed UTC+3 offset with no DST, so "Riyadh wall-clock"
    // is just UTC + 3h read back with the UTC getters.
    function getRiyadhParts(date = new Date()) {
      const shifted = new Date(date.getTime() + 3 * 3600 * 1000);
      return {
        year: shifted.getUTCFullYear(),
        month: shifted.getUTCMonth() + 1,
        day: shifted.getUTCDate(),
        hour: shifted.getUTCHours(),
        minute: shifted.getUTCMinutes()
      };
    }

    function pad2(n) { return String(n).padStart(2, '0'); }

    function dateKey(p) { return `${p.year}-${pad2(p.month)}-${pad2(p.day)}`; }

    function riyadhToUTCDate(year, month, day, hour, minute) {
      return new Date(Date.UTC(year, month - 1, day, hour - 3, minute, 0));
    }

    function parseHM(str) {
      const [h, m] = str.split(':').map(Number);
      return { h, m };
    }

    async function loadData() {
      const merged = {};
      for (const file of DATA_FILES) {
        const res = await fetch(file);
        Object.assign(merged, await res.json());
      }
      TIMES = merged;
    }

    function buildSchedule() {
      const today = getRiyadhParts();
      const tomorrow = getRiyadhParts(new Date(Date.now() + 86400000));
      const todayKey = dateKey(today);
      const tomorrowKey = dateKey(tomorrow);

      const todayT = TIMES[todayKey];
      const tomorrowT = TIMES[tomorrowKey];
      if (!todayT || !tomorrowT) {
        console.error('No local prayer-time data for', todayKey, 'or', tomorrowKey);
        return;
      }

      const isFridayToday = todayT.weekday === 'Friday';

      const list = PRAYER_KEYS.map(key => {
        const { h, m } = parseHM(todayT[key]);
        return {
          label: (key === 'Dhuhr' && isFridayToday) ? 'الجمعة' : PRAYER_NAMES[key],
          date: riyadhToUTCDate(today.year, today.month, today.day, h, m)
        };
      });

      const fajrTom = parseHM(tomorrowT.Fajr);
      list.push({
        label: PRAYER_NAMES.Fajr,
        date: riyadhToUTCDate(tomorrow.year, tomorrow.month, tomorrow.day, fajrTom.h, fajrTom.m)
      });

      schedule = list;
      scheduleDateKey = todayKey;
    }

    function getNextPrayer() {
      const now = Date.now();
      return schedule.find(p => p.date.getTime() > now) || null;
    }

    function render() {
      const next = getNextPrayer();
      if (!next) {
        labelTopEl.textContent = '';
        labelEl.textContent = '';
        valueEl.textContent = '--:--';
        return;
      }

      labelEl.textContent = next.label;

      if (scene === 1) {
        const totalMin = Math.max(0, Math.floor((next.date.getTime() - Date.now()) / 60000));
        labelTopEl.textContent = 'متبقي من الوقت لأذان';
        valueEl.textContent = `${pad2(Math.floor(totalMin / 60))}:${pad2(totalMin % 60)}`;
      } else {
        const hm = getRiyadhParts(next.date);
        labelTopEl.textContent = 'وقت أذان';
        valueEl.textContent = `${pad2(hm.hour)}:${pad2(hm.minute)}`;
      }
    }

    loadData().then(() => {
      buildSchedule();
      render();
    });

    setInterval(() => {
      const todayKey = dateKey(getRiyadhParts());
      if (todayKey !== scheduleDateKey) buildSchedule();
      render();
    }, 1000);

    setInterval(() => {
      scene = (scene === 1) ? 2 : 1;
      render();
    }, 10000);
  </script>
</body>
</html>
